[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seo-engine"
version = "0.1.0"
description = "Takes the text of one web page and returns a brief for ranking on Google and being cited by AI answer engines."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "respx>=0.21",
    "ruff>=0.6",
]
browser = [
    "playwright>=1.45",
]

[tool.hatch.build.targets.wheel]
packages = ["src/seo_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["seo_engine", "fakes", "conftest", "test_pipeline"]
