# CI for main: lint, unit tests and web build on every pull request and every push to main.
# No deploy step and no secrets: the tests use recorded fixtures and never call paid APIs.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Read-only token: CI only reads the code.
permissions:
  contents: read

# A new push to the same pull request cancels the older run; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check --output-format=github .

      - name: Unit tests
        run: pytest -q

  frontend:
    name: Web app (lint + build)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # tsc -b type-checks the whole app, then vite builds it.
      - name: Type check and build
        run: npm run build
